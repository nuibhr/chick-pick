# HTTPS preview for LINE identity and the public game catalog only.
# NODE_ENV=production intentionally disables booking, receipt review and finance writes.
services:
  - type: web
    name: chick-pick-liff-preview
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: off
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.21.0
      - key: APP_LIVE_MODE
        value: "false"
      - key: TIDB_DATABASE_URL
        sync: false
      - key: LINE_CHANNEL_ID
        sync: false
      - key: VITE_LIFF_ID
        sync: false
      - key: HF_OCR_ENDPOINT_URL
        sync: false
      - key: HF_OCR_TOKEN
        sync: false
      - key: ADMIN_SETUP_TOKEN
        sync: false
