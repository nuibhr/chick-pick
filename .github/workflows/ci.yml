name: Chick&Pick CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - 'fix/**'
      - 'feat/**'
      - 'chore/**'
  workflow_dispatch:
  schedule:
    - cron: '21 1 * * 1'

permissions:
  contents: read

concurrency:
  group: chick-pick-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, tests and Cloudflare build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: TypeScript check
        run: npm run lint

      - name: Prevent tracked credentials and private data
        run: npm run security:secrets

      - name: Automated unit and integration tests
        run: npm test

      - name: Secure Cloudflare frontend build
        run: npm run build:cloudflare

      - name: Check vulnerable dependencies
        run: npm audit --audit-level=high
