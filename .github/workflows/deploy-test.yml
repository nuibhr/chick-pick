name: Chick&Pick Test Deploy

on:
  workflow_dispatch:
    inputs:
      target:
        description: Choose safe UI preview or isolated functional UAT
        required: true
        type: choice
        default: ui-only
        options:
          - ui-only
          - isolated-uat

permissions:
  contents: read

concurrency:
  group: chick-pick-test-deploy-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  test-and-deploy:
    name: Verify and deploy test Worker only
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/fix/late-slip-evidence-20261010'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: chick-pick-uat
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      - name: Install reproducible dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run lint

      - name: Credential pattern and dependency checks
        run: |
          npm run security:secrets
          npm audit --audit-level=high

      - name: Run all regression tests before any deployment
        run: npm test

      - name: Check public assets and build
        run: npm run build:cloudflare

      - name: Check dedicated Cloudflare deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.UAT_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.UAT_CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing UAT_CLOUDFLARE_API_TOKEN in chick-pick-uat environment'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing UAT_CLOUDFLARE_ACCOUNT_ID in chick-pick-uat environment'; exit 1; }

      - name: Prepare isolated TiDB, KV, LINE, and Worker bindings
        if: inputs.target == 'isolated-uat'
        env:
          UAT_TIDB_DATABASE_URL: ${{ secrets.UAT_TIDB_DATABASE_URL }}
          UAT_ADMIN_SESSION_SECRET: ${{ secrets.UAT_ADMIN_SESSION_SECRET }}
          UAT_ADMIN_PAIRING_TOKEN: ${{ secrets.UAT_ADMIN_PAIRING_TOKEN }}
          UAT_SLIPOK_API_KEY: ${{ secrets.UAT_SLIPOK_API_KEY }}
          UAT_KV_NAMESPACE_ID: ${{ vars.UAT_KV_NAMESPACE_ID }}
          UAT_LINE_CHANNEL_ID: ${{ vars.UAT_LINE_CHANNEL_ID }}
          UAT_LIFF_ID: ${{ vars.UAT_LIFF_ID }}
          UAT_PUBLIC_APP_URL: ${{ vars.UAT_PUBLIC_APP_URL }}
          UAT_SLIPOK_BRANCH_ID: ${{ vars.UAT_SLIPOK_BRANCH_ID }}
        run: node scripts/prepareUatDeployment.mjs

      - name: Initialize isolated UAT TiDB schema (not production)
        if: inputs.target == 'isolated-uat'
        env:
          TIDB_DATABASE_URL: ${{ secrets.UAT_TIDB_DATABASE_URL }}
        run: npm run db:migrate

      - name: Deploy safe UI-only preview (no payments or database)
        if: inputs.target == 'ui-only'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.UAT_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.UAT_CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 deploy --config wrangler.uat-preview.jsonc
          echo 'UI-only preview deployed; all booking, payment and admin APIs remain disabled.' >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy isolated functional UAT (never production Worker)
        if: inputs.target == 'isolated-uat'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.UAT_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.UAT_CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 deploy --config .wrangler-uat.jsonc --secrets-file .wrangler-uat.secrets.json
          echo 'Functional UAT deployed under chick-pick-uat-isolated, not the original Worker.' >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke check isolated backend and LINE configuration
        if: inputs.target == 'isolated-uat'
        env:
          UAT_PUBLIC_APP_URL: ${{ vars.UAT_PUBLIC_APP_URL }}
          UAT_LIFF_ID: ${{ vars.UAT_LIFF_ID }}
        run: |
          node scripts/uatSmoke.mjs
          echo 'UAT health and player configuration verified. Test booking and SlipOK manually with two LINE identities.' >> "$GITHUB_STEP_SUMMARY"

      - name: Erase temporary UAT config and secrets
        if: always()
        run: rm -f .wrangler-uat.jsonc .wrangler-uat.secrets.json
